services:
  db:
    image: pgvector/pgvector:pg17
    container_name: listingaudit-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listingaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listingaudit}
      POSTGRES_DB: ${POSTGRES_DB:-listingaudit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
