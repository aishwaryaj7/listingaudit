services:
  db:
    image: pgvector/pgvector:pg17
    container_name: listingaudit-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listingaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listingaudit}
      POSTGRES_DB: ${POSTGRES_DB:-listingaudit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # The review API and the review screen from the Dockerfile, the way they run in Azure:
  #   docker compose --profile app up --build
  api:
    profiles: [ app ]
    build: .
    image: listingaudit
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data/images:/app/data/images:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  screen:
    profiles: [ app ]
    image: listingaudit
    platform: linux/amd64
    command: [ "streamlit", "run", "src/listingaudit/review/screen.py", "--server.address", "0.0.0.0" ]
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
