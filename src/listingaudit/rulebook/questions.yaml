- question: Do online offers have to show the product's safety warnings?
  answers: [gpsr/19]
- question: Does the product safety regulation apply to food?
  answers: [gpsr/2]
- question: Must a product listing include a picture of the product?
  answers: [gpsr/19]
- question: What must an online marketplace do when someone reports a dangerous product?
  answers: [gpsr/22]
- question: Which company has to be based in the EU before a product can be sold there?
  answers: [gpsr/16]
- question: Must the fabric content be visible before someone buys online?
