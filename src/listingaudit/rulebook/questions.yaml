# Test questions for the rulebook search, with the articles that answer them.
#
# Phrased in everyday words, the way a seller or reviewer would ask, and written
# before looking at any search results. A question counts as found when one of
# its articles comes back. Ids are "<law>/<article>", as in the chunk ids.

- question: A shop shows a crossed-out "was" price next to the sale price. Which earlier price may it show?
  answers: [pid/6a, pangv/11]
- question: How many days back do I look to find the lowest price before a discount?
  answers: [pid/6a, pangv/11]
- question: Can a seller put the price up for a week and then advertise a big discount?
  answers: [pid/6a, pangv/11, pid_guidance, aldi_sued]
- question: Must a "-30%" badge be worked out from the lowest price of the last 30 days?
  answers: [aldi_sued, pid/6a, pangv/11]
- question: Does the 30-day rule apply when I compare my price with the manufacturer's recommended retail price?
  answers: [pid_guidance]
- question: Do I need to show the earlier price for food reduced because it will soon go off?
  answers: [pid/6a, pangv/11]
- question: The discount grows step by step during a sale. Which earlier price do I show?
  answers: [pid/6a, pangv/11]
- question: Do I have to show the price per kilogram for coffee sold in 500 g bags?
  answers: [pangv/4, pid/3]
- question: Which quantity should the unit price use, a kilogram or 100 grams?
  answers: [pangv/5]
- question: Can I leave out the price per litre when the bottle holds exactly one litre?
  answers: [pangv/4]
- question: Does a gift box with a shampoo and a body lotion need a unit price?
  answers: [pangv/4]
- question: What is a unit price?
  answers: [pid/2, pangv/2]
- question: What information about the manufacturer must an online listing show?
